<!DOCTYPE html>
<html>
<head>
  <title>End of WWII Interactive Slides</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin: 18px;
    }

    .menu {
      margin: 12px;
    }

    button {
      font-size: 20px;
      padding: 12px 22px;
      margin: 6px;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    img {
      width: 90%;
      max-height: 75vh;
      object-fit: contain;
      border: 3px solid white;
      background: white;
      margin-top: 10px;
    }

    #slideNumber {
      font-size: 20px;
      margin: 12px;
    }
  </style>
</head>

<body>

  <h1>The End of World War II in Europe and Asia-Pacific</h1>

  <div class="menu">
    <button onclick="goToSlide(1)">Start</button>
    <button onclick="goToSlide(7)">Europe</button>
    <button onclick="goToSlide(20)">Asia-Pacific</button>
    <button onclick="goToSlide(27)">Allied Strengths</button>
    <button onclick="goToSlide(50)">Axis Weaknesses</button>
    <button onclick="goToSlide(64)">Quiz / Review</button>
  </div>

  <img id="slide" src="Chapter%206%20-%20The%20End%20of%20WWII%20in%20Europe%20and%20Asia-Pacific/slide%20(1).JPG" alt="WWII slide">

  <br>

  <button onclick="previousSlide()">Previous</button>
  <button onclick="nextSlide()">Next</button>

  <p id="slideNumber">Slide 1 / 67</p>

  <script>
    let slide = 1;
    let totalSlides = 67;

    let folder = "Chapter%206%20-%20The%20End%20of%20WWII%20in%20Europe%20and%20Asia-Pacific/";

    function getSlideFileName(number) {
      if (number === 67) {
        return folder + "slide%20(67).jpg";
      } else {
        return folder + "slide%20(" + number + ").JPG";
      }
    }

    function showSlide() {
      document.getElementById("slide").src = getSlideFileName(slide);
      document.getElementById("slideNumber").innerText = "Slide " + slide + " / " + totalSlides;
    }

    function nextSlide() {
      if (slide < totalSlides) {
        slide++;
        showSlide();
      }
    }

    function previousSlide() {
      if (slide > 1) {
        slide--;
        showSlide();
      }
    }

    function goToSlide(number) {
      slide = number;
      showSlide();
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "ArrowRight") {
        nextSlide();
      }
      if (event.key === "ArrowLeft") {
        previousSlide();
      }
    });
  </script>

</body>
</html>
